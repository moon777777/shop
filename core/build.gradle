plugins {
    id 'com.moon.myPlugin'

    id 'io.spring.dependency-management' version '1.1.7'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

group = 'com.moon'
version = '0.0.1-SNAPSHOT'
description = 'project shop'

dependencies {
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa:3.5.9'
    implementation 'org.springframework.boot:spring-boot-starter-json:3.5.9'
    runtimeOnly 'com.mysql:mysql-connector-j:8.0.33'

    testImplementation 'org.springframework.boot:spring-boot-starter-test:3.5.9'

}

tasks.named('test') {
    useJUnitPlatform()
}

